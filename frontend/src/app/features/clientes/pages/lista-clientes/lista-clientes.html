<div class="clientes-page container">
  <div class="header-actions">
    <div>
      <h1 class="serif-heading">Directorio de Clientes</h1>
      <p>Consulta información de contacto e historial de reservas de tus clientas.</p>
    </div>
    <app-button variant="gold" (btnClick)="openCreateModal()">+ NUEVA CLIENTA</app-button>
  </div>

  <!-- Barra de Búsqueda -->
  <div class="search-bar card-surface">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      (input)="onSearch()"
      placeholder="🔍 Buscar por nombre o número de WhatsApp..."
      class="search-input"
    />
  </div>

  <app-loading *ngIf="isLoading" message="Cargando lista de clientes..."></app-loading>

  <!-- Lista de Clientes en Tarjetas -->
  <div *ngIf="!isLoading" class="clientes-grid">
    <div *ngFor="let c of clientes" class="card-surface cliente-card">
      <div class="card-header">
        <div class="avatar-circle">
          {{ c.nombre.charAt(0).toUpperCase() }}
        </div>
        <div>
          <h3 class="cliente-nombre">{{ c.nombre }}</h3>
          <span class="cliente-phone">📲 {{ c.telefono }}</span>
        </div>
      </div>

      <div class="card-body">
        <p *ngIf="c.email" class="cliente-email">✉️ {{ c.email }}</p>
        <p *ngIf="c.notas" class="cliente-notas">📝 {{ c.notas }}</p>
      </div>

      <div class="card-footer">
        <a [href]="'https://wa.me/' + c.telefono" target="_blank" class="btn-wa">
          Escribir por WhatsApp
        </a>
      </div>
    </div>
  </div>

  <!-- Modal Crear Cliente -->
  <div *ngIf="showCreateModal" class="modal-overlay animate-fade-in">
    <div class="modal-card card-surface">
      <h2 class="serif-heading">Registrar Nueva Clienta</h2>
      <form (ngSubmit)="guardarCliente()" class="modal-form">
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" [(ngModel)]="nombre" name="nombre" required placeholder="Ej: María Pérez" class="form-control" />
        </div>

        <div class="form-group">
          <label>Teléfono (WhatsApp)</label>
          <input type="tel" [(ngModel)]="telefono" name="telefono" required placeholder="Ej: 573184642772" class="form-control" />
        </div>

        <div class="form-group">
          <label>Correo Electrónico (Opcional)</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="ejemplo@correo.com" class="form-control" />
        </div>

        <div class="form-group">
          <label>Notas Privadas</label>
          <textarea [(ngModel)]="notas" name="notas" rows="2" placeholder="Preferencias, alergias..." class="form-control"></textarea>
        </div>

        <div class="modal-actions">
          <app-button variant="secondary" (btnClick)="closeCreateModal()" type="button">CANCELAR</app-button>
          <app-button variant="gold" type="submit" [loading]="isSaving">REGISTRAR</app-button>
        </div>
      </form>
    </div>
  </div>
</div>
