<div class="panel">
  <header class="panel-top">
    <div class="panel-top-inner">
      <a routerLink="/dashboard" class="marca">
        <span class="marca-nombre">Claudia Santana</span>
        <span class="marca-sub">Panel</span>
      </a>

      <nav class="nav-escritorio" aria-label="Panel">
        <a *ngFor="let item of menu" [routerLink]="item.ruta" routerLinkActive="activo"
          [routerLinkActiveOptions]="{ exact: item.exacto }" class="nav-item">
          <app-icon [name]="item.icono" [size]="18" /> {{ item.texto }}
        </a>
      </nav>

      <div class="usuario">
        <span class="saludo">Hola, {{ primerNombre }}</span>
        <button type="button" class="btn-salir" (click)="logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
          <app-icon name="log-out" [size]="18" />
        </button>
      </div>
    </div>
  </header>

  <!-- Aviso para instalar la agenda en el celular -->
  <div class="instalar" *ngIf="instalarApp.mostrarAviso" role="region" aria-label="Instalar la app">
    <img src="/icons/icon-96x96.png" alt="" width="44" height="44" class="instalar-icono" />
    <div class="instalar-texto">
      <p class="instalar-titulo">Instala tu agenda en el celular</p>
      <p class="instalar-sub" *ngIf="instalarApp.puedeInstalar()">Ábrela como una app, sin buscar la página.</p>
      <p class="instalar-sub" *ngIf="!instalarApp.puedeInstalar() && instalarApp.esIOS">
        En Safari toca <strong>Compartir</strong> y luego <strong>Agregar a inicio</strong>.
      </p>
    </div>
    <button *ngIf="instalarApp.puedeInstalar()" type="button" class="btn btn-gold instalar-btn" (click)="instalarApp.instalar()">Instalar</button>
    <button type="button" class="instalar-cerrar" (click)="instalarApp.ocultar()" aria-label="Ocultar aviso">
      <app-icon name="x" [size]="18" />
    </button>
  </div>

  <main class="panel-cuerpo">
    <router-outlet></router-outlet>
  </main>

  <!-- Pestañas inferiores en el celular: se manejan con el pulgar -->
  <nav class="tabs" aria-label="Panel">
    <a *ngFor="let item of menu" [routerLink]="item.ruta" routerLinkActive="activo"
      [routerLinkActiveOptions]="{ exact: item.exacto }" class="tab">
      <app-icon [name]="item.icono" [size]="22" />
      <span>{{ item.texto }}</span>
    </a>
  </nav>
</div>
