<div class="login-wrapper">
  <div class="login-card card-surface animate-fade-in">
    <div class="brand-header">
      <h1 class="serif-heading logo-title">CLAUDIA SANTANA</h1>
      <span class="logo-sub">NAILS & BEAUTY</span>
      <p class="admin-badge gold-badge">Acceso Dashboard Administrador</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div *ngIf="errorMessage" class="error-banner">
        <span>⚠️ {{ errorMessage }}</span>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="ejemplo@claudiasantananails.com"
          required
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          required
          class="form-control"
        />
      </div>

      <app-button
        type="submit"
        variant="gold"
        [fullWidth]="true"
        [loading]="isLoading">
        INICIAR SESIÓN
      </app-button>
    </form>
  </div>
</div>
