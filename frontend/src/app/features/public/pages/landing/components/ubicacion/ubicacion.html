<section class="section ubicacion" id="ubicacion">
  <div class="container grid">
    <div class="info">
      <span class="eyebrow">Visítanos</span>
      <h2>Te esperamos en Mosquera</h2>

      <ul class="datos">
        <li>
          <app-icon name="map-pin" />
          <div>
            <p class="dato-titulo">Dirección</p>
            <p>{{ salon.direccion }}</p>
          </div>
        </li>
        <li>
          <app-icon name="clock" />
          <div>
            <p class="dato-titulo">Horario</p>
            <p *ngFor="let linea of horarioTexto">{{ linea }}</p>
          </div>
        </li>
        <li>
          <app-icon name="phone" />
          <div>
            <p class="dato-titulo">WhatsApp</p>
            <p>{{ salon.telefonoVisible }}</p>
          </div>
        </li>
      </ul>

      <div class="acciones">
        <a class="btn btn-ink" [href]="salon.mapsUrl" target="_blank" rel="noopener">
          <app-icon name="navigation" [size]="18" /> Cómo llegar
        </a>
        <a class="btn btn-outline" [href]="whatsapp" target="_blank" rel="noopener">
          <app-icon name="message" [size]="18" /> Escribir por WhatsApp
        </a>
      </div>
    </div>

    <div class="mapa">
      <iframe [src]="mapa" title="Mapa de ubicación del salón" loading="lazy"
        referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    </div>
  </div>
</section>
