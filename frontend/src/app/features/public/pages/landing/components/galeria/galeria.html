<section class="section galeria" id="galeria">
  <div class="container">
    <div class="section-header">
      <span class="eyebrow">Nuestro trabajo</span>
      <h2>Detalles que se notan</h2>
      <p>Algunos de los diseños que salen del salón.</p>
    </div>

    <div class="mosaico">
      <figure *ngFor="let item of trabajos; let i = index" class="pieza" [class.grande]="i === 0">
        <img [src]="item.imagen" [alt]="item.titulo" loading="lazy" />
        <figcaption>
          <span class="pieza-tag">{{ item.tag }}</span>
          <span class="pieza-titulo">{{ item.titulo }}</span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
